# Tests puis déploiement de l'API sur le VPS à chaque push sur master (merge compris).
# Sur une PR vers master : tests seulement. Détail de chaque test : onglet Checks de la PR
# ou résumé de l'exécution dans Actions (« Tests API »).
#
# Secrets (Settings → Secrets and variables → Actions → Secrets) :
#   VPS_HOST      IP ou nom du VPS
#   VPS_USER      utilisateur SSH de déploiement
#   VPS_SSH_KEY   clé privée SSH dédiée au déploiement (la clé publique dans ~/.ssh/authorized_keys du VPS)
# Variables facultatives (onglet Variables) :
#   API_DEPLOY_PATH   dossier de l'API sur le VPS      (défaut : /home/pkmn/publish)
#   API_SERVICE       service systemd à redémarrer      (défaut : pkmnracebattle-api)
# Sur le VPS, l'utilisateur de déploiement possède le dossier (groupe pkmn, qui fait tourner le service)
# et n'a le droit sudo que pour « systemctl restart <service> ».
name: Déploiement API

on:
  push:
    branches: [master]
  # Sur une PR vers master : tests seulement (pas de déploiement), résultat affiché dans la PR
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_PATH: ${{ vars.API_DEPLOY_PATH || '/home/pkmn/publish' }}
  SERVICE: ${{ vars.API_SERVICE || 'pkmnracebattle-api' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test PkmnRaceBattle.Tests --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Rapport de tests
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Tests API
          path: TestResults/tests.trx
          reporter: dotnet-trx

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publication
        run: dotnet publish PkmnRaceBattle.API/PkmnRaceBattle.API.csproj -c Release -o out
      - name: Clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Envoi sur le VPS
        # appsettings*.json du VPS conservés (chaîne de connexion Mongo de prod) ;
        # fichiers lisibles et modifiables par le groupe pkmn
        run: >
          rsync -az --delete --exclude 'appsettings*.json' --chmod=D2775,F664
          -e "ssh -i ~/.ssh/id_deploy"
          out/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$DEPLOY_PATH/"
      - name: Redémarrage
        run: ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "sudo systemctl restart $SERVICE && systemctl is-active $SERVICE"
